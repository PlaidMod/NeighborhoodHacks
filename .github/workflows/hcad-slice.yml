# One-off HCAD slice for the address lookup (P1 data, docs/p1-data-loading.md).
# Downloads HCAD's public property files on GitHub's runner, keeps only the chosen ZIP codes and the
# allowed columns (account, street address, legal description, tax codes; no owner, mail, value or
# exemption fields), checks the slice, and saves it as a private artifact for 3 days.
# Nothing is written to Supabase here: download the artifact and run npm run load:hcad.
name: HCAD lookup slice

on:
  workflow_dispatch:
    inputs:
      year:
        description: HCAD data year
        required: true
        default: '2026'
      zips:
        description: Comma-separated ZIP codes to keep
        required: true
        default: '77002,77003,77004,77006,77007,77008,77019,77021,77098,77433'

permissions:
  contents: read

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YEAR: ${{ inputs.year }}
      ZIPS: ${{ inputs.zips }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the inputs
        run: |
          [[ "$YEAR" =~ ^20[0-9]{2}$ ]] || { echo "year must look like 2026"; exit 1; }
          [[ "$ZIPS" =~ ^[0-9]{5}(,[0-9]{5})*$ ]] || { echo "zips must be comma-separated 5-digit codes"; exit 1; }
      - name: Download HCAD property files
        run: |
          mkdir -p "tmp/scratch/hcad/dl" "tmp/scratch/hcad/raw-$YEAR"
          curl -fsSL --retry 3 -o tmp/scratch/hcad/dl/acct.zip "https://download.hcad.org/data/CAMA/$YEAR/Real_acct_owner.zip"
          curl -fsSL --retry 3 -o tmp/scratch/hcad/dl/jur.zip "https://download.hcad.org/data/CAMA/$YEAR/Real_jur_exempt.zip"
          unzip -l tmp/scratch/hcad/dl/acct.zip
          unzip -l tmp/scratch/hcad/dl/jur.zip
          unzip -j -o tmp/scratch/hcad/dl/acct.zip real_acct.txt -d "tmp/scratch/hcad/raw-$YEAR"
          unzip -j -o tmp/scratch/hcad/dl/jur.zip jur_value.txt -d "tmp/scratch/hcad/raw-$YEAR"
      - name: Keep only the selected ZIP codes and allowed columns
        run: npm run stage:hcad -- --source-dir "tmp/scratch/hcad/raw-$YEAR" --output tmp/scratch/hcad/slice --source-year "$YEAR" --zips "$ZIPS"
      - name: Check the slice (dry run, no database)
        run: npm run load:hcad -- --input tmp/scratch/hcad/slice --source-year "$YEAR"
      - uses: actions/upload-artifact@v4
        with:
          name: hcad-slice-${{ inputs.year }}
          path: tmp/scratch/hcad/slice/
          retention-days: 3
          if-no-files-found: error
